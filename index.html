<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trivia Time! 🧠</title>
<style>
  :root {
    --bg-gradient-1: #667eea;
    --bg-gradient-2: #764ba2;
    --card-bg: #ffffff;
    --text-dark: #2d2d3a;
    --text-muted: #6b6b7b;
    --correct: #2ecc71;
    --incorrect: #e74c3c;
    --accent: #764ba2;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
    padding: 20px;
  }

  .quiz-container {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    width: 100%;
    max-width: 560px;
    padding: 32px;
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .header h1 {
    font-size: 1.6rem;
    margin: 0;
    color: var(--text-dark);
  }

  .score-badge {
    background: var(--accent);
    color: white;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.95rem;
    white-space: nowrap;
  }

  .progress-bar-track {
    width: 100%;
    height: 8px;
    background: #eee;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--bg-gradient-1), var(--bg-gradient-2));
    border-radius: 999px;
    transition: width 0.35s ease;
    width: 0%;
  }

  .question-count {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 6px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .question-text {
    font-size: 1.3rem;
    color: var(--text-dark);
    margin: 0 0 22px 0;
    line-height: 1.4;
    min-height: 60px;
  }

  .options {
    display: grid;
    gap: 12px;
  }

  .option-btn {
    text-align: left;
    padding: 14px 18px;
    border: 2px solid #e3e3ec;
    border-radius: 12px;
    background: #fafafd;
    font-size: 1rem;
    color: var(--text-dark);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #f2eefb;
    transform: translateY(-1px);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .option-btn.correct {
    background: #eafaf1;
    border-color: var(--correct);
    color: #1e8449;
    font-weight: 600;
  }

  .option-btn.incorrect {
    background: #fdecea;
    border-color: var(--incorrect);
    color: #b03a2e;
    font-weight: 600;
  }

  .feedback {
    margin-top: 16px;
    min-height: 24px;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .feedback.correct-text {
    color: var(--correct);
  }

  .feedback.incorrect-text {
    color: var(--incorrect);
  }

  .next-btn, .play-again-btn {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .next-btn:hover, .play-again-btn:hover {
    opacity: 0.92;
    transform: translateY(-1px);
  }

  .next-btn:disabled {
    display: none;
  }

  .hidden {
    display: none !important;
  }

  .results-screen {
    text-align: center;
  }

  .results-emoji {
    font-size: 3.5rem;
    margin-bottom: 8px;
  }

  .results-screen h2 {
    color: var(--text-dark);
    margin: 0 0 8px 0;
  }

  .results-score {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--accent);
    margin: 8px 0 6px 0;
  }

  .results-message {
    color: var(--text-muted);
    margin-bottom: 4px;
    font-size: 1.05rem;
  }
</style>
</head>
<body>

<div class="quiz-container">

  <!-- Quiz Screen -->
  <div id="quiz-screen">
    <div class="header">
      <h1>🧠 Trivia Time!</h1>
      <div class="score-badge">Score: <span id="score-display">0</span></div>
    </div>

    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>

    <div class="question-count">Question <span id="question-number">1</span> of <span id="question-total">10</span></div>
    <p class="question-text" id="question-text"></p>

    <div class="options" id="options-container"></div>

    <div class="feedback" id="feedback-text"></div>

    <button class="next-btn hidden" id="next-btn">Next Question →</button>
  </div>

  <!-- Results Screen -->
  <div id="results-screen" class="results-screen hidden">
    <div class="results-emoji" id="results-emoji">🎉</div>
    <h2>Quiz Complete!</h2>
    <div class="results-score"><span id="final-score">0</span> / <span id="final-total">10</span></div>
    <p class="results-message" id="results-message"></p>
    <button class="play-again-btn" id="play-again-btn">🔄 Play Again</button>
  </div>

</div>

<script>
  const questions = [
    {
      question: "What do you call a group of flamingos?",
      options: ["A flamboyance", "A flock", "A squad", "A parade"],
      answer: 0
    },
    {
      question: "Which planet is known as the 'Red Planet'?",
      options: ["Venus", "Jupiter", "Mars", "Saturn"],
      answer: 2
    },
    {
      question: "What is the only food that never spoils?",
      options: ["Rice", "Honey", "Salt", "Sugar"],
      answer: 1
    },
    {
      question: "How many hearts does an octopus have?",
      options: ["1", "2", "3", "4"],
      answer: 2
    },
    {
      question: "What is the smallest country in the world?",
      options: ["Monaco", "San Marino", "Vatican City", "Liechtenstein"],
      answer: 2
    },
    {
      question: "Which instrument has 88 keys?",
      options: ["Organ", "Piano", "Harpsichord", "Accordion"],
      answer: 1
    },
    {
      question: "In which country would you find the ancient city of Machu Picchu?",
      options: ["Mexico", "Brazil", "Peru", "Chile"],
      answer: 2
    },
    {
      question: "What is a baby kangaroo called?",
      options: ["Cub", "Joey", "Kid", "Pup"],
      answer: 1
    },
    {
      question: "Which gas do plants primarily absorb for photosynthesis?",
      options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"],
      answer: 2
    },
    {
      question: "How many sides does a hexagon have?",
      options: ["5", "6", "7", "8"],
      answer: 1
    }
  ];

  let currentIndex = 0;
  let score = 0;
  let answered = false;

  const quizScreen = document.getElementById('quiz-screen');
  const resultsScreen = document.getElementById('results-screen');
  const questionText = document.getElementById('question-text');
  const optionsContainer = document.getElementById('options-container');
  const scoreDisplay = document.getElementById('score-display');
  const questionNumber = document.getElementById('question-number');
  const questionTotal = document.getElementById('question-total');
  const progressFill = document.getElementById('progress-fill');
  const feedbackText = document.getElementById('feedback-text');
  const nextBtn = document.getElementById('next-btn');
  const playAgainBtn = document.getElementById('play-again-btn');
  const finalScore = document.getElementById('final-score');
  const finalTotal = document.getElementById('final-total');
  const resultsMessage = document.getElementById('results-message');
  const resultsEmoji = document.getElementById('results-emoji');

  questionTotal.textContent = questions.length;
  finalTotal.textContent = questions.length;

  function loadQuestion() {
    answered = false;
    feedbackText.textContent = '';
    feedbackText.className = 'feedback';
    nextBtn.classList.add('hidden');

    const q = questions[currentIndex];
    questionNumber.textContent = currentIndex + 1;
    questionText.textContent = q.question;
    progressFill.style.width = `${(currentIndex / questions.length) * 100}%`;

    optionsContainer.innerHTML = '';
    q.options.forEach((option, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = option;
      btn.addEventListener('click', () => selectAnswer(idx));
      optionsContainer.appendChild(btn);
    });
  }

  function selectAnswer(selectedIdx) {
    if (answered) return;
    answered = true;

    const q = questions[currentIndex];
    const buttons = optionsContainer.querySelectorAll('.option-btn');

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.answer) {
        btn.classList.add('correct');
      } else if (idx === selectedIdx) {
        btn.classList.add('incorrect');
      }
    });

    if (selectedIdx === q.answer) {
      score++;
      scoreDisplay.textContent = score;
      feedbackText.textContent = '✅ Correct! Nice work.';
      feedbackText.classList.add('correct-text');
    } else {
      feedbackText.textContent = `❌ Not quite — the correct answer was "${q.options[q.answer]}".`;
      feedbackText.classList.add('incorrect-text');
    }

    progressFill.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

    nextBtn.classList.remove('hidden');
    nextBtn.textContent = currentIndex === questions.length - 1 ? 'See Results →' : 'Next Question →';
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    quizScreen.classList.add('hidden');
    resultsScreen.classList.remove('hidden');
    finalScore.textContent = score;

    const pct = score / questions.length;
    let message, emoji;
    if (pct === 1) {
      message = "Perfect score! You're a trivia legend! 🏆";
      emoji = '🏆';
    } else if (pct >= 0.7) {
      message = "Great job! You really know your stuff.";
      emoji = '🎉';
    } else if (pct >= 0.4) {
      message = "Not bad! A little more trivia practice and you'll be unstoppable.";
      emoji = '🙂';
    } else {
      message = "Everyone starts somewhere — give it another shot!";
      emoji = '🤔';
    }
    resultsMessage.textContent = message;
    resultsEmoji.textContent = emoji;
  }

  function resetQuiz() {
    currentIndex = 0;
    score = 0;
    scoreDisplay.textContent = 0;
    progressFill.style.width = '0%';
    resultsScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');
    loadQuestion();
  }

  nextBtn.addEventListener('click', nextQuestion);
  playAgainBtn.addEventListener('click', resetQuiz);

  loadQuestion();
</script>

</body>
</html>
